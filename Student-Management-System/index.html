<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management System</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Our own CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-dark app-navbar shadow-sm">
    <div class="container">
      <span class="navbar-brand mb-0 h1">🎓 Student Management System</span>
    </div>
  </nav>

  <div class="container my-4">

    <!-- Dashboard Cards -->
    <div class="row mb-4">
      <div class="col-md-4">
        <div class="card stat-card shadow-sm">
          <div class="card-body">
            <p class="text-muted mb-1">Total Students</p>
            <h2 id="totalStudents" class="mb-0">0</h2>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">

      <!-- Registration Form -->
      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-header fw-bold" id="formTitle">Student Registration</div>
          <div class="card-body">
            <form id="studentForm">

              <div class="mb-3">
                <label for="studentId" class="form-label">Student ID</label>
                <input type="text" class="form-control" id="studentId" required>
              </div>

              <div class="mb-3">
                <label for="studentName" class="form-label">Student Name</label>
                <input type="text" class="form-control" id="studentName" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
              </div>

              <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" pattern="[0-9]{10}"
                       title="Enter a 10 digit phone number" required>
              </div>

              <div class="mb-3">
                <label for="department" class="form-label">Department</label>
                <select class="form-select" id="department" required>
                  <option value="">Select department</option>
                  <option>BCA</option>
                  <option>BSc Computer Science</option>
                  <option>BCom</option>
                  <option>BBA</option>
                  <option>BA</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label d-block">Gender</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="gender" id="male" value="Male" required>
                  <label class="form-check-label" for="male">Male</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
                  <label class="form-check-label" for="female">Female</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="gender" id="other" value="Other">
                  <label class="form-check-label" for="other">Other</label>
                </div>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" id="saveBtn">Save Student</button>
                <button type="button" class="btn btn-outline-secondary" id="cancelBtn">Clear Form</button>
              </div>

            </form>
          </div>
        </div>
      </div>

      <!-- Student Table -->
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span class="fw-bold">All Students</span>
            <input type="text" id="searchInput" class="form-control search-box"
                   placeholder="Search by name...">
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Gender</th>
                    <th class="text-center">Actions</th>
                  </tr>
                </thead>
                <tbody id="studentTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Our own JavaScript -->
  <script src="script.js"></script>
</body>
</html>
